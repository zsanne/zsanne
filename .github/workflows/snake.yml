name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 午夜运行一次
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # 红色的蛇 + 绿色的方块（贡献色块）
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff0000&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ff4d4d&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
